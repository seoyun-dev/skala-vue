<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Weather Intelligence</title>
    <script>
      // GitHub Pages는 SPA 라우트(/weather/seoul 등)를 새로고침하면 404를 반환한다.
      // 원래 경로를 쿼리스트링으로 인코딩해 index.html로 넘기고, 거기서 history.replaceState로 복원한다.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // 프로젝트 페이지이므로 /vue3-playground/ 한 칸을 유지
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
